name: Alex Assistant CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-ci:
    name: Backend CI (Python & Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install httpx

      - name: Execute Backend Tests
        env:
          JWT_SECRET: "ci_test_jwt_secret_key_32_bytes_minimum_len!"
          ENCRYPTION_KEY: "ci_test_encryption_key_32_bytes_len!"
          GEMINI_API_KEY: "ci_test_gemini_key"
        run: |
          PYTHONPATH=backend pytest backend/tests

  frontend-ci:
    name: Frontend CI (Next.js Lint & Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Build Next.js Production App
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000/api/v1"
          NEXT_PUBLIC_WS_URL: "ws://localhost:8000/api/v1"
        run: npm run build
