name: Alex Assistant CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-ci:
    name: Backend CI (Python & Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install httpx

      - name: Execute Backend Tests
        env:
          PYTHONPATH: backend
          JWT_SECRET: "ci_test_jwt_secret_key_32_bytes_minimum_len!"
          ENCRYPTION_KEY: "ci_test_encryption_key_32_bytes_len!"
          GEMINI_API_KEY: "ci_test_gemini_key"
        run: |
          python -m pytest backend/tests

  frontend-ci:
    name: Frontend CI (Next.js Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install --legacy-peer-deps

      - name: Run ESLint Check
        working-directory: ./frontend
        run: npm run lint

      - name: Build Next.js Production App
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000/api/v1"
          NEXT_PUBLIC_WS_URL: "ws://localhost:8000/api/v1"
        run: npm run build

  deploy-vercel:
    name: Deploy to Vercel (CD)
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy Frontend to Vercel
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        working-directory: ./frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

      - name: Check Vercel Secrets Configuration
        if: ${{ secrets.VERCEL_TOKEN == '' }}
        run: |
          echo "===================================================================================================="
          echo "⚠️ Vercel deployment step skipped because VERCEL_TOKEN secret is not set in GitHub Secrets."
          echo "To enable automatic deployment, add VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID to:"
          echo "GitHub Repo -> Settings -> Secrets and variables -> Actions"
          echo "===================================================================================================="
